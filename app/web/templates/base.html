<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Kalvid AI{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Kalvid<span>AI</span></a>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/rates">Rates</a>
    <a href="/docs">API</a>
  </nav>
  <div class="mode {{ 'mode-safe' if status.dry_run else 'mode-live' }}">
    {{ 'DRY RUN — $0' if status.dry_run else 'LIVE — BILLABLE' }}
  </div>
</header>

{% if status.warnings %}
<div class="warnings">
  {% for w in status.warnings %}
    <div class="warn {{ 'warn-ok' if 'DRY RUN' in w else 'warn-hot' }}">{{ w }}</div>
  {% endfor %}
</div>
{% endif %}

<main>{% block body %}{% endblock %}</main>

<script src="/static/app.js"></script>
</body>
</html>
